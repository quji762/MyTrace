# Pulse.Win (Windows) release pipeline: tests -> MSIX -> sign -> release.
# Separate from the upstream macOS release.yml; triggered by windows-* tags so
# the two platforms can ship independently.
name: windows-release

on:
  push:
    tags: ["windows-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test (unit + provider contract fixtures)
        run: dotnet test Pulse.Win/Pulse.Win.slnx --configuration Release

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish x64 self-contained
        run: |
          dotnet publish Pulse.Win/src/Pulse.App/Pulse.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:PublishReadyToRun=true `
            -o Pulse.Win/artifacts/publish

      # MSIX packaging via the Windows SDK's MakeAppx. Signing requires a
      # certificate the release owner supplies (PFX base64 + password secrets);
      # without one the MSIX is left unsigned for a local signing step.
      - name: Package MSIX
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter MakeAppx.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          New-Item -ItemType Directory -Force -Path Pulse.Win/artifacts | Out-Null
          & $makeappx pack /d Pulse.Win/artifacts/publish /p Pulse.Win/artifacts/PulseWin.msix /nv

      - name: Sign MSIX
        if: env.SIGNING_PFX != ''
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          $pfx = "Pulse.Win/artifacts/signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          & $signtool sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD Pulse.Win/artifacts/PulseWin.msix
          Remove-Item $pfx

      # Secret scan: canary-shaped values must never appear in logs or artifacts.
      - name: Canary secret scan
        shell: pwsh
        run: |
          $hits = Get-ChildItem Pulse.Win -Recurse -Include *.log,*.trx -ErrorAction SilentlyContinue |
            Select-String -Pattern "PULSE_TEST_API_KEY|PULSE_TEST_COOKIE|PULSE_TEST_REFRESH_TOKEN" -ErrorAction SilentlyContinue
          if ($hits) { $hits; exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PulseWin-${{ github.ref_name }}
          path: |
            Pulse.Win/artifacts/PulseWin.msix
            Pulse.Win/artifacts/publish

      - name: Attach release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pulse.Win/artifacts/PulseWin.msix
          generate_release_notes: true
